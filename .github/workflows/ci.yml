name: ci

# The runner is pinned rather than `ubuntu-latest`. That label migrates to
# Ubuntu 26 from 2026-10-19, and a runner OS changing underneath a build on
# someone else's schedule is a variable worth not having. Move it deliberately,
# as its own commit, so a failure that follows is attributable.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.14 is included because it is what this is developed on. A package
        # whose own author runs an untested interpreter is one bug report away
        # from finding that out in public.
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -q

  quickstart:
    # The two-command quickstart is the headline claim, so it is tested rather
    # than asserted: a clean machine, a build from source, an install of the
    # wheel, and the commands a reader will actually type first.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build && python -m build
      # One package in the wheel, and nothing else. A stale `build/` directory from
      # before the package was renamed shipped the OLD package alongside the new
      # one, and every other check passed: the install worked, the commands ran,
      # and the wheel quietly carried a second copy of the code. CI builds on a
      # clean checkout so it would not have caught it; this does.
      - name: the wheel holds exactly one package
        run: |
          python - <<'EOF'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          tops = sorted({n.split("/")[0] for n in names})
          pkgs = [t for t in tops if not t.endswith(".dist-info")]
          print("top-level:", tops)
          assert pkgs == ["sunflower_thresh"], f"unexpected packages in the wheel: {pkgs}"
          assert any(n == "sunflower_thresh/almanac/snapshot.yaml" for n in names), \
              "the vendored obligation catalogue must ship"
          assert sum(n.startswith("sunflower_thresh/rubrics/") for n in names) == 12, \
              "all twelve judge rubrics must ship"
          EOF
      - run: pip install dist/*.whl
      - run: thresh --version
      - run: thresh doctor
      # The headline is `thresh demo`, so CI runs the command a reader types
      # first and asserts the two things the output must contain: a measured
      # row, and a case reported as not probed rather than as a zero.
      - name: the quickstart produces a measured result with no key
        run: |
          thresh demo | tee /tmp/demo.txt
          grep -q "cases considered" /tmp/demo.txt
          grep -q "not probed" /tmp/demo.txt
          grep -q "matched" /tmp/demo.txt

      # The rubric library is DATA, and `src/` held no non-Python file before it.
      # So the failure mode this catches is specific and invisible locally: a
      # missing `package-data` entry gives a wheel with no rubrics while a source
      # checkout has all of them, and every test passes either way because the
      # tests run from the checkout. Only an installed user would find out, by
      # having the judge silently find nothing.
      - name: the installed wheel carries the rubric library
        run: |
          thresh judge | tee /tmp/judge.txt
          grep -q "WITHHELD" /tmp/judge.txt
          if grep -qE "rubric library: +0 " /tmp/judge.txt; then
            echo "the wheel shipped no rubrics" >&2
            exit 1
          fi

      # The dry calibration pass needs no endpoint and no GPU, which is exactly
      # why it belongs here. It asserts the read-out can tell three different
      # broken judges apart -- always-yes, always-no, and one that answers without
      # a number -- and a clean result would mean the detector sees nothing. That
      # third case once scored 0 and was reported TOO TIMID, sending an operator to
      # lower a threshold that was never the problem.
      - name: the calibration detector can tell the three failures apart
        run: |
          thresh calibrate | tee /tmp/cal.txt
          grep -q "the detector behaves" /tmp/cal.txt

      # The lab is the target the quickstart attacks, so "it starts and answers"
      # is part of the claim rather than an implementation detail.
      - name: the bundled lab serves with no model and no key
        run: |
          thresh lab --port 5005 &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:5005/health >/dev/null 2>&1 && break
            sleep 0.25
          done
          curl -fsS http://127.0.0.1:5005/health | tee /dev/stderr | grep -q '"deterministic": true'
