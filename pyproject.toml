[project]
name = "sunflower-stem"
version = "0.1.0.dev0"
description = "Measure whether an attack on an LLM application actually worked, against a control, proved on a channel the target does not control."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DATA", "NOTICE"]
authors = [{ name = "Sunflower Consulting" }]
keywords = ["llm", "security", "red-team", "prompt-injection", "evaluation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
stem = "sunflower_stem.cli:main"

[project.urls]
Homepage = "https://github.com/sunflower-consulting/stem"
Source = "https://github.com/sunflower-consulting/stem"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# The rubric library is DATA and `src/` had no non-Python file before it, so there
# was no working precedent to copy and no MANIFEST.in. Without this a wheel install
# has no rubrics while a source checkout has all twelve -- which is the worst
# version of that split, because the tests would pass either way and only an
# installed user would see the judge find nothing. The quickstart CI job installs a
# built wheel on a clean machine, which is what makes this assertable rather than
# assumed.
[tool.setuptools.package-data]
sunflower_stem = ["rubrics/*.yaml", "trellis/*.yaml"]

[tool.pytest.ini_options]
# `src` for the package, `.` so `tests.paths` imports whatever pytest was launched
# as. Without the second entry `python -m pytest` works and a bare `pytest` does
# not, because only the former puts the working directory on sys.path -- so every
# local run and every worktree check passed while CI failed on all four Pythons.
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# SIM103 rewrites a guard-clause chain into `return not (not a and b)`. The gate
# and the authorization record are written as sequential guard clauses on
# purpose: each refusal sits next to the comment explaining it, and a reader
# checking whether the order is fail-closed has to be able to read them in
# order. A compound boolean is shorter and strictly harder to audit.
ignore = ["SIM103"]

[tool.ruff.lint.per-file-ignores]
# The lab is a measurement instrument, kept behaviourally identical to the
# version the private harness's characterisation tests describe. Editing its
# branch structure or its shebang to satisfy a linter would make the two drift
# for no behavioural gain, and a benchmark target that quietly stopped being the
# same target is the one change here that cannot be noticed from a result.
"src/sunflower_stem/lab/*" = ["SIM102", "EXE001"]
