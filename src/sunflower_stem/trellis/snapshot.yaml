  ai-act:Art.14(1)-(3):
    id: ai-act:Art.14(1)-(3)
    instrument: ai-act
    citation: Art.14(1)-(3)
    title: Human oversight by design
    applies_from: '2027-12-02'
    role: provider
    system_class:
    - annex-iii-high-risk
    summary: The system must be designed and developed, including its human-machine interface, so that
      natural persons can effectively oversee it throughout the period it is in use. That oversight must
      aim to prevent or minimise risks to health, safety or fundamental rights arising either from use
      as intended or from reasonably foreseeable misuse, with particular attention to risks that remain
      despite the other high-risk requirements, and the measures must be commensurate with the system's
      risk, autonomy and context of use, built into the product by the provider where technically feasible,
      identified by the provider for the deployer to implement, or both.
    evidence_expected: 'The oversight design: which measures are built into the product and which are
      handed to the deployer, the proportionality reasoning against the system''s autonomy and context
      of use, and the interface artefacts that implement them.'
    verifiable: hybrid
    status: active
    source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: An adversarial run can show oversight is not effective in practice, for instance that a reviewer
      is given no basis on which to disagree with the system. Whether the provider identified and allocated
      the measures before placing the system on the market is only visible on review. Unamended by the
      Omnibus. For Annex I product-embedded high-risk systems the date is 2028-08-02. Summary replaced
      on review against the consolidated text.
  ai-act:Art.14(4):
    id: ai-act:Art.14(4)
    instrument: ai-act
    citation: Art.14(4)
    title: Capabilities the overseer must be enabled to exercise
    applies_from: '2027-12-02'
    role: provider
    system_class:
    - annex-iii-high-risk
    summary: The system must reach the deployer in a state where the people assigned to oversee it are
      enabled, so far as appropriate and proportionate, to understand its capacities and limits and duly
      monitor its operation (including detecting and addressing anomalies, dysfunctions and unexpected
      performance), stay alert to the pull of relying or over-relying on its output, interpret output
      correctly, decide not to use the system at all or to disregard, override or reverse its output,
      and intervene in or interrupt the system so that it comes to rest in a safe state.
    evidence_expected: 'Demonstration against each limb: the monitoring and anomaly surfaces available
      to the overseer, the training or guidance addressing automation bias, the interpretation aids, and
      a tested override and stop path showing the system actually comes to rest in a safe state when invoked.'
    verifiable: hybrid
    status: active
    source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'The most testable limbs of the oversight requirement: the presence and behaviour of an intervention
      or stop control under point (e), and the override path under point (d), can be exercised directly
      against the deployed system. The automation-bias awareness limb under point (b) is a training and
      process matter that no probe reaches, which is why this is hybrid and not test. Paragraph 5, requiring
      separate confirmation by two competent people for remote biometric identification under Annex III
      point 1(a), is not reached by a typical LLM application and is not recorded separately. Unamended
      by the Omnibus. For Annex I product-embedded high-risk systems the date is 2028-08-02. Summary replaced
      on review against the consolidated text.'
  ai-act:Art.15(1):
    id: ai-act:Art.15(1)
    instrument: ai-act
    citation: Art.15(1)
    title: Appropriate accuracy, robustness and cybersecurity, consistent over the lifecycle
    applies_from: '2027-12-02'
    role: provider
    system_class:
    - annex-iii-high-risk
    summary: A high-risk system must be designed and built to reach an appropriate level of accuracy,
      robustness and cybersecurity, and to hold that level consistently throughout its life. This is the
      umbrella duty that the rest of the article elaborates.
    evidence_expected: Measured accuracy, robustness and security results against the stated intended
      purpose, the reasoning for why those levels count as appropriate for this use, and evidence of monitoring
      over time showing performance has not drifted away from them.
    verifiable: hybrid
    status: active
    source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: A measurement campaign produces direct evidence of the levels achieved and can show a shortfall.
      But what level is appropriate is a judgement against intended purpose, and the duty is framed as
      one of design and development plus consistency over the lifecycle, neither of which a point-in-time
      run establishes. Unamended by the Omnibus. For Annex I product-embedded high-risk systems the date
      is 2028-08-02.
