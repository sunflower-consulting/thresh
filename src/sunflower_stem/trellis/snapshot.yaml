tier:
  schema_version: 1
  classes:
    prohibited:
      label: Prohibited practice
      note: Article 5. Not a risk tier to manage; a thing that may not be deployed.
    annex-iii-high-risk:
      label: High-risk, stand-alone (Annex III)
    annex-i-high-risk:
      label: High-risk, embedded in a regulated product (Annex I)
    gpai:
      label: General-purpose AI model
    gpai-systemic-risk:
      label: General-purpose AI model with systemic risk
    limited-risk:
      label: Transparency obligations only
      note: A chatbot a person interacts with, or a system generating synthetic content. This is where
        most assistant deployments land, and the obligations are real even though the label sounds mild.
    minimal-risk:
      label: No specific obligations under the Act
    important-entity:
      label: In scope of DORA or the Digital Security Act
      note: Not an AI Act class. Here because the catalogue keys sector duties to it.
    ict-third-party:
      label: ICT third-party service provider under DORA
    product-with-digital-elements:
      label: In scope of the Cyber Resilience Act
    samfunnsviktig-tjeneste:
      label: Provider of a socially important service (digitalsikkerhetsloven)
      note: Norway's own category, not NIS2's essential/important split. The statute transposes NIS1 through
        the EEA agreement and Norway has not transposed NIS2, so using NIS2 vocabulary here would misstate
        which regime a client is in.
    digital-tjeneste:
      label: Provider of a digital service (digitalsikkerhetsloven)
    needs-legal-review:
      label: Cannot be determined from the description
      note: The honest output when the answer turns on intended purpose, on whether a carve-out applies,
        or on a fact nobody has established. Carries the question to put to a lawyer rather than a guess.
  questions:
  - id: prohibited
    ask: Does the system do any of the things Article 5 forbids outright - manipulative or exploitative
      techniques causing significant harm, social scoring, untargeted scraping of facial images, emotion
      inference in workplaces or education outside medical or safety uses, or biometric categorisation
      inferring protected characteristics?
    if_yes: prohibited
    note: Asked first and asked plainly. A deployment usually drifts into one of these through a feature
      nobody framed that way - an engagement-optimising assistant that learns to exploit a vulnerability,
      a support bot inferring mood to route tickets.
  - id: annex-i-embedded
    ask: Is the AI a safety component of, or itself, a product covered by the Union harmonisation legislation
      in Annex I - medical devices, machinery, vehicles, lifts, toys and the rest - requiring third-party
      conformity assessment?
    if_yes: annex-i-high-risk
    note: Different and later date from stand-alone Annex III systems.
  - id: annex-iii-area
    ask: Does the system's INTENDED PURPOSE fall within one of the eight Annex III areas below, at the
      level of the specific use rather than the area heading?
    if_no: transparency
    if_yes: annex-iii-carve-out
    areas:
      biometrics: Remote biometric identification, biometric categorisation by protected attributes, emotion
        recognition. Biometric verification - confirming someone is who they claim - is carved out in
        the Annex itself.
      critical-infrastructure: Safety components in the management and operation of critical digital infrastructure,
        road traffic, or the supply of water, gas, heating and electricity.
      education: Admission or assignment to institutions, evaluating learning outcomes, assessing the
        appropriate level of education, monitoring and detecting prohibited behaviour during tests.
      employment: Recruitment and selection, decisions on terms, promotion and termination, task allocation,
        and monitoring or evaluating performance and behaviour.
      essential-services: Eligibility for public assistance benefits and services, creditworthiness and
        credit scoring, risk assessment and pricing in life and health insurance, and emergency call triage
        and dispatch.
      law-enforcement: Risk of offending or re-offending, polygraph-like tools, evidence evaluation, profiling
        in the course of detection and investigation. Note the Annex's own carve-out for financial-fraud
        detection.
      migration: Risk assessments on persons entering, examination of asylum, visa and residence applications,
        and detection of irregular immigration.
      justice-democracy: Assisting judicial authorities in researching and interpreting facts and law,
        and influencing the outcome of an election or referendum or voting behaviour.
  - id: annex-iii-carve-out
    ask: Does Article 6(3) apply - the system performs a narrow procedural task, improves the result of
      a previously completed human activity, detects decision patterns or deviations without replacing
      or influencing human assessment, or performs preparatory work?
    if_yes: needs-legal-review
    if_no: annex-iii-high-risk
    note: Resolved to review rather than to minimal-risk on purpose. The carve-out does NOT apply where
      the system profiles natural persons, and "does not influence human assessment" is a claim about
      how a decision is really made rather than about what the documentation says. That is a question
      for a lawyer with the deployment in front of them, and a tool that answered it would be guessing
      at the one point where guessing is expensive.
  - id: transparency
    ask: Does the system interact directly with people, generate synthetic audio, image, video or text,
      or recognise emotions?
    if_yes: limited-risk
    if_no: minimal-risk
    note: Where a customer-facing assistant lands when it is not high-risk. The obligations are disclosure
      and marking, they are not onerous, and they are the ones most often missed because the label reads
      as "nothing to do here".
  also_ask:
  - id: dora
    ask: Is the deployer a financial entity in scope of DORA?
    if_yes: important-entity
  - id: dora-third-party
    ask: Does the organisation SUPPLY this system to financial entities?
    if_yes: ict-third-party
  - id: cra
    ask: Is the system placed on the EU market as, or inside, a product with digital elements?
    if_yes: product-with-digital-elements
  open_checks:
  - Whether the Digital Omnibus changed the treatment of AI used solely for non-safety purposes such as
    user assistance or optimisation. Seen in secondary sources, not confirmed against the official text,
    and deliberately NOT encoded above. Confirm on EUR-Lex before any rule here relies on it.
calendar:
  schema_version: 1
  last_reviewed: 2026-10-15
  milestones:
  - date: 2025-02-02
    instrument: ai-act
    what: Prohibited practices under Article 5 become enforceable.
    confidence: secondary
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689
  - date: 2025-08-02
    instrument: ai-act
    what: Obligations for providers of general-purpose AI models begin to apply. Not postponed by the
      Digital Omnibus.
    confidence: secondary
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689
  - date: 2026-07-27
    instrument: ai-act
    what: The Digital Omnibus on AI, Regulation (EU) 2026/1744, enters into force. It moved the high-risk
      dates and did not change the classification rules or the content of the obligations - which is why
      mapping work done before it did not expire.
    confidence: confirmed
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32026R1744
  - date: 2026-08-02
    instrument: ai-act
    what: 'The AI Act applies in general, including the Article 50 transparency duties that bind a customer-facing
      assistant. These were NOT postponed, which is the single most commercially relevant date in this
      file: the obligations that bite on an ordinary chatbot are already live while the high-risk ones
      are a year away.'
    confidence: confirmed
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689
  - date: 2026-09-11
    instrument: cra
    what: Vulnerability-handling and reporting duties under the Cyber Resilience Act begin.
    confidence: secondary
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R2847
  - date: 2027-08-02
    instrument: ai-act
    what: Member States must have national regulatory sandboxes in place.
    confidence: secondary
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R1689
  - date: 2027-12-02
    instrument: ai-act
    what: Obligations for stand-alone high-risk systems under Annex III apply. Moved here from 2026-08-02
      by the Digital Omnibus.
    confidence: confirmed
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32026R1744
  - date: 2027-12-11
    instrument: cra
    what: The Cyber Resilience Act applies in full.
    confidence: secondary
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32024R2847
  - date: 2028-08-02
    instrument: ai-act
    what: Obligations for high-risk AI embedded in products under Annex I apply. Moved here from 2027-08-02
      by the Digital Omnibus. A different date from Annex III, and conflating the two is the most common
      error in circulation.
    confidence: confirmed
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32026R1744
  - date: 2025-01-17
    instrument: dora
    what: DORA applies across the EU.
    confidence: secondary
    source: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32022R2554
  - date: 2025-07-01
    instrument: dora
    what: DORA in force in Norway.
    confidence: secondary
    source: https://lovdata.no/
  - date: 2025-10-01
    instrument: nis2-no
    what: Norway's Digital Security Act in force, carrying incident-notification duties and security requirements
      for entities in scope.
    confidence: secondary
    source: https://lovdata.no/
  - date: 2026-09-01
    instrument: dora
    what: DORA extended in Norway to further categories of entity, including finance companies, estate
      agents and debt collectors.
    confidence: secondary
    source: https://lovdata.no/
  open_checks:
  - Every entry marked `secondary` wants one pass against the official text. The Omnibus-moved dates are
    confirmed and are the ones most likely to be quoted, so they were checked first.
  - Whether Norway is bound by NIS2 itself through the EEA agreement, as distinct from having its own
    Digital Security Act. These are different questions and are often run together.
