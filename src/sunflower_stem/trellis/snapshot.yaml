  ai-act:Art.26(6):
    id: ai-act:Art.26(6)
    instrument: ai-act
    citation: Art.26(6)
    title: Deployer retention of automatically generated logs
    applies_from: '2027-12-02'
    role: deployer
    system_class:
    - annex-iii-high-risk
    summary: The deployer must keep the logs the system generates automatically, so far as those logs
      are under its control, for a period suited to the intended purpose and in any event for at least
      six months, unless other Union or national law, in particular data protection law, requires otherwise.
    evidence_expected: The log retention configuration and policy showing the period held, a reasoned
      statement of which logs are under the deployer's control as opposed to the provider's, the justification
      for the period chosen against the intended purpose, and any data-protection constraint relied on
      to hold them for a different time.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: Review rather than hybrid, deliberately. A probe can show logs exist, but the obligation is
      about a retention period that no adversarial run occupying hours or days can observe; establishing
      it means inspecting retention configuration and log age. The division of control between provider
      and deployer is the first thing to pin down in a hosted-model deployment. Financial institutions
      keep these as part of their financial-services documentation. Unamended by the Omnibus. For Annex
      I product-embedded high-risk systems the date is 2028-08-02.
  ai-act:Art.26(7):
    id: ai-act:Art.26(7)
    instrument: ai-act
    citation: Art.26(7)
    title: Informing workers before workplace deployment
    applies_from: '2027-12-02'
    role: deployer
    system_class:
    - annex-iii-high-risk
    summary: An employer deploying a high-risk system in the workplace must tell workers' representatives
      and the affected workers, before putting it into service or using it, that they will be subject
      to it. The information follows applicable Union and national rules on informing workers and their
      representatives.
    evidence_expected: The notification itself with its date, proof it went to both the representatives
      and the affected workers, and evidence it preceded putting the system into service, together with
      the national information and consultation rules relied on.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'The timing is the compliance point: the notice must come before the system is put into service
      or used, so a notification dated after go-live does not discharge it. National information and consultation
      law varies, so the applicable procedure must be identified per Member State. Unamended by the Omnibus.
      For Annex I product-embedded high-risk systems the date is 2028-08-02.'
  ai-act:Art.26(9):
    id: ai-act:Art.26(9)
    instrument: ai-act
    citation: Art.26(9)
    title: Use of provider information for the data protection impact assessment
    applies_from: '2027-12-02'
    role: deployer
    system_class:
    - annex-iii-high-risk
    summary: Where a data protection impact assessment is required, the deployer must use the information
      the provider supplied under the transparency article to carry it out.
    evidence_expected: The data protection impact assessment itself, showing on its face that it draws
      on the provider's instructions for use, including the declared accuracy, robustness and cybersecurity
      levels and the stated limitations, rather than being written without reference to them.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: The cross-reference is to Art 35 of Regulation (EU) 2016/679 or Art 27 of Directive (EU) 2016/680,
      and applies only where one of those assessments is in fact required. A practical review test is
      whether the assessment and the provider's instructions contradict each other on performance or limitations.
      Unamended by the Omnibus. For Annex I product-embedded high-risk systems the date is 2028-08-02.
  ai-act:Art.4a(1):
    id: ai-act:Art.4a(1)
    instrument: ai-act
    citation: Art.4a(1)
    title: Processing of special categories of personal data for bias detection and correction
    applies_from: '2026-07-27'
    role: provider
    system_class:
    - annex-iii-high-risk
    summary: A provider of a high-risk system may handle sensitive personal data to find and correct bias,
      but only where no other data would do the job and only under a closed list of safeguards. Those
      cover necessity, pseudonymisation and security, strict documented access control, no onward sharing,
      deletion once the bias is corrected, and a written justification in the processing records.
    evidence_expected: A necessity assessment showing synthetic or anonymised data would not have worked;
      the pseudonymisation and access-control design with the access log; the retention and deletion schedule
      plus proof it executed; and the entry in the record of processing activities giving the reasons
      the sensitive data was needed.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026R1744
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'Date settled against the Omnibus and the amended Article 113: Article 4a sits in Chapter I,
      Article 113 applies Chapter I from 2025-02-02 with carve-outs that do not include it, and the Omnibus
      defers none of its own amendments - so the provision operates from the day it existed in law, 2026-07-27.
      CARRY THIS CAVEAT TO A CLIENT: recital 9 of the Omnibus points instead at the AI Act''s general
      application date of 2026-08-02, six days later. A recital cannot postpone an unambiguous operative
      provision, so 2026-07-27 is the reading; a client with low risk appetite may prefer to wait the
      six days. That is a risk choice, not a different reading. Text source-confirmed; the DATE is what
      is unconfirmed, which is why this record is flagged. Article 4a was inserted by the Omnibus and
      sits in Chapter I, which Art 113 third paragraph point (a) applies from 2 February 2025 - a date
      before this article existed. The Omnibus sets no specific application date for it in Art 113, and
      its own Art 4 only sets entry into force. Recital 38 of the Omnibus states the intent that this
      legal basis apply from the AI Act''s date of entry into application, which points at 2 August 2026
      rather than either 2 February 2025 or 27 July 2026. I have used 27 July 2026 as the earliest date
      the provision can operate, but the face of the text does not resolve this. In scope beyond the briefed
      article list because Art 10(1) and 10(6) now fold the Art 4a(1) conditions into the data-set quality
      criteria, so a data-governance review reaches it through Article 10. Art 4a(2) extends a comparable
      permission to deployers of high-risk systems and to providers and deployers of other systems, and
      says expressly that it creates no duty to perform bias detection.'
  ai-act:Art.5:
    id: ai-act:Art.5
    instrument: ai-act
    citation: Art.5
    title: Prohibited AI practices
    applies_from: '2025-02-02'
    role: both
    system_class:
    - prohibited
    summary: 'Bans a defined list of AI practices, binding whoever places such a system on the market,
      puts it into service or uses it. Several limbs carry their own carve-outs, so the list is not a
      set of unqualified bans. Applicable since 2 February 2025: subliminal or manipulative techniques,
      and exploitation of vulnerability tied to age, disability or socio-economic situation, in each case
      where behaviour is materially distorted and significant harm is caused or reasonably likely; social
      scoring; predicting criminal offending from profiling or personality traits alone; untargeted scraping
      of facial images to build or expand recognition databases; emotion inference in workplaces and education,
      outside medical and safety uses; biometric categorisation inferring sensitive traits; and real-time
      remote biometric identification in publicly accessible spaces for law enforcement, which is permitted
      only for narrow listed objectives and subject to prior authorisation and further conditions. Two
      limbs added by the Digital Omnibus apply only from 2 December 2026 and are drawn far more narrowly
      than the rest. The first covers systems that generate or manipulate realistic depictions of an identifiable
      person''s intimate parts, or of that person engaged in sexually explicit activity, absent that person''s
      freely given, specific, informed, unambiguous and explicit consent to the generation or manipulation;
      editing that neither increases the exposure of depicted intimate parts nor alters the nature of
      the depicted activity does not count as manipulation for this limb. The second covers systems that
      generate or manipulate child sexual abuse material and pornographic performance as defined in Directive
      2011/93/EU, subject to any defence under national law for acting with legal right. For both new
      limbs the prohibition is split by role. The supply-side limb reaches a provider only where such
      generation or manipulation is the system''s intended purpose, or where the system''s design, training,
      architecture, capabilities or user-facing functionality make it a reasonably foreseeable and reproducible
      outcome without significant technical modification and the system lacks reasonable and adequate
      technical safety measures and other safeguards to reliably prevent it, taking reasonably foreseeable
      misuse into account, and to correct misuse once observed or reported. The use-side limb reaches
      a deployer only where the deployer uses the system for the purpose of producing such material. Capability
      for misuse alone therefore does not engage either new limb where adequate preventive and corrective
      safeguards are in place.'
    evidence_expected: A written assessment mapping the deployment's intended purpose, deployment context
      and user population against each prohibition, with a reasoned conclusion per limb; plus, for the
      generative prohibitions, red-team transcripts showing the system refuses to produce the prohibited
      material and a record of the safeguards relied on.
    verifiable: hybrid
    status: active
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-5
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'Two application dates, and the record carries the earlier because that is when the article
      first binds: points (a) to (h) from 2025-02-02, and the limbs the Omnibus inserted - Article 5(1)
      points (ba) and (bb) and paragraphs 1a and 1b - from 2026-12-02, confirmed from the amended Article
      113 itself. The previous summary overstated scope four ways: it read the new limbs as a flat ban
      on generation, where Article 5(1a) reaches a provider only on intended purpose or reasonably foreseeable
      reproducible output absent adequate safeguards, and a deployer only on actual use; it said generation
      where the text says generation or manipulation; it dropped the realistic, identifiable-person and
      explicit-consent qualifiers in (ba); and it treated (bb) as standing alone where it is defined by
      cross-reference to Directive 2011/93/EU.'
  ai-act:Art.50(1):
    id: ai-act:Art.50(1)
    instrument: ai-act
    citation: Art.50(1)
    title: Disclosure that a person is interacting with an AI system
    applies_from: '2026-08-02'
    role: provider
    system_class:
    - limited-risk
    summary: A provider of an AI system meant to interact directly with people must build it so those
      people are told they are dealing with an AI system, unless that would be obvious to a reasonably
      well-informed and observant person in the circumstances. A narrow carve-out exists for systems authorised
      by law for criminal-offence purposes, subject to safeguards, unless the public can use them to report
      an offence.
    evidence_expected: The disclosure as presented in the live deployment, captured across entry points
      and across resumed or embedded sessions, together with the reasoning if obviousness is relied on
      instead of an express notice.
    verifiable: test
    status: active
    source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'Beyond the briefed article list but squarely within scope, and included because it is one
      of the very few AI Act duties already in application that a red team can test on a deployed LLM
      application today. Confirmed to sit in Chapter IV, which Art 113 does not except, so it runs from
      the general date of application, 2 August 2026, and not from the deferred high-risk dates. It is
      independent of high-risk classification, hence the system_class value. Testable directly: the notice
      is either presented or it is not. The obviousness exception involves judgement a probe cannot settle.
      Unamended by the Omnibus.'
  ai-act:Art.50(3):
    id: ai-act:Art.50(3)
    instrument: ai-act
    citation: Art.50(3)
    title: Transparency obligations for providers and deployers of certain AI systems
    applies_from: '2026-08-02'
    role: deployer
    system_class:
    - limited-risk
    summary: A deployer of an emotion recognition or biometric categorisation system must tell the people
      exposed to it how the system operates, and must handle their personal data under the applicable
      EU data protection law. Certain legally authorised criminal-law uses are excepted.
    evidence_expected: The notice as exposed persons actually receive it, with evidence of when and where
      it is served; plus the data protection record for the processing, typically the Article 30 GDPR
      record and any impact assessment, and a determination of whether the deployed feature performs emotion
      inference or biometric categorisation at all.
    verifiable: hybrid
    status: active
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'Date is the Article 113 general date of 2 August 2026; unflagged in the consolidated text,
      so not touched by the Digital Omnibus. Included because assistants that infer user sentiment or
      emotional state can fall in scope. Classified hybrid: a probe can show the notice is missing, but
      whether the feature is emotion recognition within the definition, and whether the data protection
      limb is met, are review questions. Note the separate Article 5(1)(f) prohibition on emotion inference
      in workplaces and education, which overrides rather than supplements this paragraph.'
  ai-act:Art.50(5):
    id: ai-act:Art.50(5)
    instrument: ai-act
    citation: Art.50(5)
    title: Transparency obligations for providers and deployers of certain AI systems
    applies_from: '2026-08-02'
    role: both
    system_class:
    - limited-risk
    summary: The information required by the preceding paragraphs must be given clearly and in a way the
      user can distinguish, no later than the first interaction or exposure. It must also meet the applicable
      accessibility requirements.
    evidence_expected: Evidence of the disclosure at or before first contact, showing its placement and
      prominence in the real interface rather than in documentation; plus an accessibility conformance
      record covering the disclosure itself, including behaviour under a screen reader.
    verifiable: test
    status: active
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-50
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'Date is the Article 113 general date of 2 August 2026, unflagged. Classified test because
      timing, clarity and distinguishability are directly observable at runtime and a probe produces affirmative
      evidence of them. The accessibility limb is the exception: conformance against the applicable accessibility
      law is a documented review matter, so a reviewer should not treat a passing interaction test as
      covering it.'
  ai-act:Art.55(1)(b):
    id: ai-act:Art.55(1)(b)
    instrument: ai-act
    citation: Art.55(1)(b)
    title: Obligations of providers of general-purpose AI models with systemic risk
    applies_from: '2025-08-02'
    role: provider
    system_class:
    - gpai-systemic-risk
    summary: The provider must assess and mitigate systemic risks at EU level, including where those risks
      come from. The duty covers risks arising from developing the model, placing it on the market and
      using it.
    evidence_expected: The systemic risk assessment, identifying sources and covering the development,
      market and use phases, together with the mitigations chosen, the residual risk accepted and who
      signed it off; plus evidence the assessment was revisited for material model changes.
    verifiable: hybrid
    status: active
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-55
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'Date read off Article 113(2): 2 August 2025, not postponed. Classified hybrid: a probe that
      elicits an unmitigated systemic-risk behaviour is evidence the mitigation limb failed, but the assessment
      itself is a document and no probe shows it exists or that its scope was adequate.'
  ai-act:Art.55(1)(c):
    id: ai-act:Art.55(1)(c)
    instrument: ai-act
    citation: Art.55(1)(c)
    title: Obligations of providers of general-purpose AI models with systemic risk
    applies_from: '2025-08-02'
    role: provider
    system_class:
    - gpai-systemic-risk
    summary: The provider must keep track of serious incidents, document them, and report them together
      with possible corrective measures to the AI Office and, where relevant, national authorities. Reporting
      must happen without undue delay.
    evidence_expected: The incident procedure with its severity thresholds and escalation path, the incident
      log, and for each logged incident the detection time, the report time and the corrective measures
      notified, so that the delay can actually be measured.
    verifiable: review
    status: active
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-55
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'Date read off Article 113(2): 2 August 2025, not postponed. Classified review: no adversarial
      run can establish that a provider tracks, documents and reports incidents to a regulator, or that
      it does so without undue delay. A probe may generate an incident but cannot observe the reporting
      pathway, so test evidence has no purchase on this duty at all.'
  ai-act:Art.55(1)(d):
    id: ai-act:Art.55(1)(d)
    instrument: ai-act
    citation: Art.55(1)(d)
    title: Obligations of providers of general-purpose AI models with systemic risk
    applies_from: '2025-08-02'
    role: provider
    system_class:
    - gpai-systemic-risk
    summary: The provider must maintain an adequate level of cybersecurity protection for the model and
      for the physical infrastructure it runs on.
    evidence_expected: The threat model covering model weight exfiltration and infrastructure compromise,
      the controls deployed against it, recent penetration test or security assessment reports with remediation
      status, and the physical security arrangements for the hosting environment.
    verifiable: hybrid
    status: active
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-55
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'Date read off Article 113(2): 2 August 2025, not postponed. Classified hybrid: an offensive
      test can demonstrate protection is inadequate, for instance by finding a weight exfiltration path,
      but whether the overall level is adequate, and anything about physical infrastructure, is established
      by review. Note the scope is the model and its infrastructure, not the application layer, so application-level
      findings do not evidence this duty.'
  ai-act:Art.72:
    id: ai-act:Art.72
    instrument: ai-act
    citation: Art.72
    title: Post-market monitoring by providers and post-market monitoring plan for high-risk AI systems
    applies_from: '2027-12-02'
    role: provider
    system_class:
    - annex-iii-high-risk
    summary: A provider of a high-risk system must set up and document a post-market monitoring system,
      proportionate to the technology and its risks, that actively and systematically gathers and analyses
      performance data over the system's life, including data from deployers. The monitoring must rest
      on a written plan that forms part of the technical documentation.
    evidence_expected: 'The post-market monitoring plan as part of the Annex IV technical documentation,
      plus evidence it is actually running: the data actually collected, the analyses performed against
      the Chapter III Section 2 requirements, and the changes or corrective actions that followed.'
    verifiable: review
    status: active
    source_url: https://ai-act-service-desk.ec.europa.eu/en/ai-act/article-72
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'Date caveat, and the one a reviewer is most likely to get wrong. 2026-08-02 is an inference,
      not a date stated in the article: Article 113 sets a general application date of 2 August 2026 and
      lists no exception covering Chapter IX, where Article 72 sits, so the article itself bites then.
      But its substance binds providers of high-risk systems, and the Digital Omnibus moved the Chapter
      III Sections 1-3 obligations to 2 December 2027 for Annex III systems and 2 August 2028 for Annex
      I systems, so in practice the duty has nothing to attach to until a system is within those deferred
      regimes. Do not report this as a live 2026 duty for a deployment that is not yet high-risk-regulated.
      Classified review: a monitoring system and plan are documentation and process, and no probe against
      a deployed system can establish either exists. Date corrected on review to 2027-12-02, the Annex
      III route a deployed LLM application takes; an Annex I product-embedded system follows 2028-08-02.'
  ai-act:Art.9:
    id: ai-act:Art.9
    instrument: ai-act
    citation: Art.9
    title: Risk management system
    applies_from: '2027-12-02'
    role: provider
    system_class:
    - annex-iii-high-risk
    summary: The provider must run a documented, continuously updated risk management process over the
      whole life of the system, covering risks to health, safety and fundamental rights in both intended
      use and reasonably foreseeable misuse, and adopt measures that bring each residual risk and the
      overall residual risk to a level judged acceptable. The system must also be tested before it goes
      to market against metrics and probabilistic thresholds fixed in advance.
    evidence_expected: 'The risk management file as a living document: a hazard and risk register tied
      to the stated intended purpose and to foreseeable misuse, the risk measures adopted against each
      entry, the residual-risk acceptability decision with the name and authority of whoever made it,
      the pre-market test protocol showing its metrics and thresholds were defined beforehand, and a revision
      history showing systematic review rather than a one-off exercise.'
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'Classified review, not hybrid, deliberately. Paragraphs 6 to 8 require pre-market testing,
      so test reports form part of the evidence, but the duty itself is a process: no adversarial run
      can establish that the process exists, that it is iterative, or that residual risk was judged acceptable
      by someone competent. A red-team finding of an unmitigated foreseeable risk is corroborating evidence
      of a gap under paragraph 2(d); it is not evidence of compliance with the article. Paragraph 9 requires
      explicit consideration of whether the system adversely affects under-18s and other vulnerable groups.
      Paragraph 10 lets firms already subject to Union internal-risk-management law combine this with
      those procedures. Unamended by the Omnibus. For Annex I product-embedded high-risk systems the date
      is 2028-08-02.'
  cra:Annex I Part I(2)(a):
    id: cra:Annex I Part I(2)(a)
    instrument: cra
    citation: Annex I Part I(2)(a)
    title: Essential cybersecurity requirements, Part I
    applies_from: '2027-12-11'
    role: manufacturer
    system_class:
    - product-with-digital-elements
    summary: Subject to the product's risk assessment, a product with digital elements must be put on
      the market free of known exploitable vulnerabilities.
    evidence_expected: Pre-release security test and scan results with triage decisions, the vulnerability
      register as it stood at release, and the risk assessment showing the requirement was treated as
      applicable.
    verifiable: hybrid
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: The sharpest epistemic case in this set, and a place where a dataset could easily overclaim.
      A red-team run can show an exploitable vulnerability is present, which is real evidence of breach.
      It cannot show the vulnerability was known at the moment of placing on the market, and knowledge
      is what the requirement turns on. So a test can disconfirm, but only the release records can establish
      compliance.
  cra:Annex I Part II(1):
    id: cra:Annex I Part II(1)
    instrument: cra
    citation: Annex I Part II(1)
    title: Vulnerability handling requirements
    applies_from: '2027-12-11'
    role: manufacturer
    system_class:
    - product-with-digital-elements
    summary: The manufacturer must identify and document the vulnerabilities and components in the product,
      which includes producing a software bill of materials in a common machine-readable format covering
      at least the product's top-level dependencies.
    evidence_expected: The SBOM itself in a machine-readable format, its generation and update process,
      and the vulnerability register it feeds.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: Only top-level dependencies are required as a floor, though the Commission may specify the
      format by implementing act. An SBOM is an artefact; no probe against a running system can produce
      it, so this is review and nothing more.
  cra:Annex I Part II(4):
    id: cra:Annex I Part II(4)
    instrument: cra
    citation: Annex I Part II(4)
    title: Vulnerability handling requirements
    applies_from: '2027-12-11'
    role: manufacturer
    system_class:
    - product-with-digital-elements
    summary: Once a security update is out, the manufacturer must share and publicly disclose information
      about the fixed vulnerability, including its description, affected products, impact, severity and
      how users can remediate. Publication may be held back where the manufacturer judges the risks of
      disclosing to outweigh the benefits, but only until users have had a chance to patch.
    evidence_expected: Published advisories mapped to the corresponding fixes, and the written justification
      for any delayed publication together with the date users could first patch.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    last_checked: '2026-10-15'
    verification: source-confirmed
  cra:Annex I Part II(5):
    id: cra:Annex I Part II(5)
    instrument: cra
    citation: Annex I Part II(5)
    title: Vulnerability handling requirements
    applies_from: '2027-12-11'
    role: manufacturer
    system_class:
    - product-with-digital-elements
    summary: The manufacturer must put a coordinated vulnerability disclosure policy in place and enforce
      it.
    evidence_expected: The published policy, and evidence it is actually followed, such as handling records
      for externally reported vulnerabilities showing acknowledgement, triage and disclosure against the
      policy's own terms.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: Existence is documentary. Enforcement is shown by case records rather than by probing, so this
      stays review.
  cra:Annex I Part II(6):
    id: cra:Annex I Part II(6)
    instrument: cra
    citation: Annex I Part II(6)
    title: Vulnerability handling requirements
    applies_from: '2027-12-11'
    role: manufacturer
    system_class:
    - product-with-digital-elements
    summary: The manufacturer must take measures making it easier to share information about potential
      vulnerabilities in its product and in the third-party components inside it, including by publishing
      a contact address for reporting vulnerabilities found in the product.
    evidence_expected: The published reporting contact and where it appears in the product's user information,
      plus records showing inbound reports are received and routed.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: Classified conservatively. One could call this hybrid on the basis that sending a test report
      can show the intake channel is dead, but the duty is organisational and the contact address is published
      product information, checked by inspection rather than by an adversarial run. Art.13(17) separately
      requires a single point of contact that does not force users through automated tools only.
  cra:Annex I Part II(7):
    id: cra:Annex I Part II(7)
    instrument: cra
    citation: Annex I Part II(7)
    title: Vulnerability handling requirements
    applies_from: '2027-12-11'
    role: manufacturer
    system_class:
    - product-with-digital-elements
    summary: The manufacturer must provide mechanisms that distribute updates securely, so vulnerabilities
      are fixed or mitigated in good time and, where it applies to security updates, automatically.
    evidence_expected: Design documentation for the update channel covering signing and transport protection,
      key management records, and test results for update integrity and rollback.
    verifiable: hybrid
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'One of the few provisions in this set where an adversarial run genuinely bears on the requirement:
      the update channel can be attacked directly, and unsigned or tamperable updates evidence failure.
      Whether the mechanism exists and is operated correctly still needs the design and key-management
      record.'
  cra:Art.13(6):
    id: cra:Art.13(6)
    instrument: cra
    citation: Art.13(6)
    title: Obligations of manufacturers
    applies_from: '2027-12-11'
    role: manufacturer
    system_class:
    - product-with-digital-elements
    summary: On finding a vulnerability in an integrated component, including an open-source one, the
      manufacturer must report it to whoever makes or maintains that component and must fix it under the
      vulnerability-handling requirements. If it wrote a fix, it must pass the code or documentation upstream.
    evidence_expected: Upstream reports or issue threads for component vulnerabilities, with dates tied
      to internal discovery dates, plus the patches or documentation shared upstream.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: Directly engaged by an LLM application built on third-party or open-source model and inference
      components. No probe can show whether an upstream report was sent, so this is review only.
  cra:Art.13(8):
    id: cra:Art.13(8)
    instrument: cra
    citation: Art.13(8)
    title: Obligations of manufacturers
    applies_from: '2027-12-11'
    role: manufacturer
    system_class:
    - product-with-digital-elements
    summary: Vulnerabilities in the product and its components must be handled effectively throughout
      a support period the manufacturer itself sets, which must normally be at least five years. The manufacturer
      must also hold policies and procedures, including a coordinated disclosure policy, for processing
      reported vulnerabilities.
    evidence_expected: The documented support-period determination and the reasoning behind it, the coordinated
      vulnerability disclosure policy, and the vulnerability intake and remediation procedure with a sample
      of worked cases.
    verifiable: hybrid
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: A probe that finds an unhandled vulnerability inside the support period shows the duty was
      breached, but the support-period determination and the policies are documents that no probe can
      produce. Shorter support periods are allowed only where the product is expected to be in use for
      less than five years.
  cra:Art.14(1)-(2):
    id: cra:Art.14(1)-(2)
    instrument: cra
    citation: Art.14(1)-(2)
    title: Reporting obligations of manufacturers
    applies_from: '2026-09-11'
    role: manufacturer
    system_class:
    - product-with-digital-elements
    summary: A manufacturer that learns of an actively exploited vulnerability in its product must notify
      the coordinating CSIRT and ENISA at the same time, through the single reporting platform. An early
      warning is due within 24 hours, a fuller notification within 72 hours, and a final report no later
      than 14 days after a fix or mitigation is available.
    evidence_expected: Platform submission receipts for each of the three stages, timestamped against
      the internal record of when the manufacturer became aware, plus the final report's description of
      the vulnerability, severity and remedy.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'Already in force: Art.14 applies from 11 September 2026 under Art.71(2), ahead of the rest
      of the CRA. This is the date most likely to be reported wrongly as 11 December 2027. Reporting to
      an authority leaves only a documentary trail, so no adversarial run can establish compliance.'
  cra:Art.14(8):
    id: cra:Art.14(8)
    instrument: cra
    citation: Art.14(8)
    title: Reporting obligations of manufacturers
    applies_from: '2026-09-11'
    role: manufacturer
    system_class:
    - product-with-digital-elements
    summary: After becoming aware of an actively exploited vulnerability or a severe incident, the manufacturer
      must tell the affected users about it and, where needed, about the mitigations they can apply, in
      a machine-readable form where that is appropriate.
    evidence_expected: The user notices actually issued, their distribution lists and dates, and any machine-readable
      advisory feed.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2024/2847/oj
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: If the manufacturer is slow, the notified CSIRTs may inform users themselves. Applies from
      11 September 2026.
  digitalsikkerhetsloven:digitalsikkerhetsforskriften § 10:
    id: digitalsikkerhetsloven:digitalsikkerhetsforskriften § 10
    instrument: digitalsikkerhetsloven
    citation: digitalsikkerhetsforskriften § 10
    title: Teknologiske sikkerhetstiltak (technological security measures)
    applies_from: '2025-10-01'
    role: entity
    system_class:
    - samfunnsviktig-tjeneste
    summary: Based on its risk assessment, a provider of an essential service must apply technological
      measures fitted to the scale, complexity and risk of its systems, and these must as a minimum cover
      strong authentication, access control, network and service segmentation on a least-privilege basis,
      resilience and timely recovery, capacity to absorb overload and equipment failure, quality-assured
      and tested updates, and security monitoring to detect incidents. Any of these left out needs the
      head of the organisation's approval, a documented justification and notice to the supervisory authority.
    evidence_expected: Control-by-control evidence against the seven minimum measures, the update testing
      and quality assurance records, monitoring and detection coverage, and for any omission the leader's
      approval, the documented reasoning and proof the supervisory authority was told.
    verifiable: hybrid
    status: active
    source_url: https://lovdata.no/dokument/SF/forskrift/2025-06-20-1131
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'Scope settled on review: § 10 "Teknologiske sikkerhetstiltak" of digitalsikkerhetsforskriften
      (FOR-2025-06-20-1131) sits in Kapittel 2 and binds only providers of socially important services
      (tilbydere av samfunnsviktige tjenester). It does not bind providers of digital services. The most
      adversarially testable provision in the Norwegian set: authentication strength, access control,
      segmentation, least privilege and overload resilience can all be probed directly, and a successful
      probe evidences failure. It stays hybrid rather than test because the minimum list is anchored to
      the documented risk assessment and because the exception route runs entirely through documents.
      Applies to providers of essential services only; the regulation''s Chapter 2 does not reach digital
      service providers. Filed under digitalsikkerhetsloven rather than a NIS2 key: this statute transposes
      Directive (EU) 2016/1148 (NIS1) through the EEA agreement, and Norway has not transposed NIS2. Labelling
      it NIS2 would misstate which regime a client is in. Which of the two regimes this binds - tilbydere
      av samfunnsviktige tjenester or tilbydere av digitale tjenester - was not established from the text,
      so both are listed and this record is unconfirmed. digitalsikkerhetsloven splits the two at paragraph
      6 and paragraph 9, and a reader must check which chapter of the forskrift this sits in.'
  digitalsikkerhetsloven:digitalsikkerhetsforskriften § 13:
    id: digitalsikkerhetsloven:digitalsikkerhetsforskriften § 13
    instrument: digitalsikkerhetsloven
    citation: digitalsikkerhetsforskriften § 13
    title: Hendelseshåndtering og beredskap (incident handling and contingency)
    applies_from: '2025-10-01'
    role: entity
    system_class:
    - samfunnsviktig-tjeneste
    summary: A provider of an essential service must hold a contingency plan for handling incidents and
      for notification under § 17. It must also consider which contingency measures and tightenings of
      existing security measures could be brought in quickly if needed.
    evidence_expected: The contingency and incident-handling plan, the assessment of measures that can
      be escalated at short notice, and exercise or live-incident records showing the plan works.
    verifiable: hybrid
    status: active
    source_url: https://lovdata.no/dokument/SF/forskrift/2025-06-20-1131
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'An exercise or a real incident can show the plan fails in practice, but the plan and the escalation
      assessment are documents. Filed under digitalsikkerhetsloven rather than a NIS2 key: this statute
      transposes Directive (EU) 2016/1148 (NIS1) through the EEA agreement, and Norway has not transposed
      NIS2. Labelling it NIS2 would misstate which regime a client is in.'
  digitalsikkerhetsloven:digitalsikkerhetsforskriften § 14:
    id: digitalsikkerhetsloven:digitalsikkerhetsforskriften § 14
    instrument: digitalsikkerhetsloven
    citation: digitalsikkerhetsforskriften § 14
    title: Oppfølgingsplikt (duty to follow up suppliers)
    applies_from: '2025-10-01'
    role: entity
    system_class:
    - samfunnsviktig-tjeneste
    summary: 'Oppfølgingsplikt - the supplier follow-up duty. An essential-service provider carries two
      obligations towards suppliers and anyone else doing work that could affect the security of its networks
      and information systems, where that work is done for or on behalf of the provider. First, it must
      satisfy itself that such work is actually carried out in a way that keeps the adequate-security
      requirements met: an active assurance duty, not merely a paper one. Second, it must make its own
      security measures binding on those suppliers, by contract or another suitable means, to the extent
      needed to maintain an adequate level of security. In practice the provider cannot discharge its
      security obligations by outsourcing the work, so an AI system bought from a vendor falls squarely
      within this: the provider must flow its controls down to the vendor and then verify the vendor is
      honouring them.'
    evidence_expected: Contract clauses or equivalent instruments flowing security requirements down to
      suppliers, the register of suppliers whose work can affect security, and the assurance activity
      over them such as reviews, audits or attestations.
    verifiable: review
    status: active
    source_url: https://lovdata.no/dokument/SF/forskrift/2025-06-20-1131
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'Scope settled on review: Digitalsikkerhetsforskriften (FOR-2025-06-20-1131) § 14 "Oppfølgingsplikt"
      binds only tilbydere av samfunnsviktige tjenester. It sits in Kapittel 2, the chapter of requirements
      for essential-service providers (§§ 6-14), and its own operative text names that provider as the
      duty-bearer in both ledd. It does not bind tilbydere av digitale tjenester: the digital-services
      chapter is Kapittel 3 and contains § 15 alone, which incorp Directly relevant where an LLM application
      depends on third-party model providers, inference hosts or retrieval services, since those suppliers''
      work can affect the security of the delivering systems. Filed under digitalsikkerhetsloven rather
      than a NIS2 key: this statute transposes Directive (EU) 2016/1148 (NIS1) through the EEA agreement,
      and Norway has not transposed NIS2. Labelling it NIS2 would misstate which regime a client is in.
      Which of the two regimes this binds - tilbydere av samfunnsviktige tjenester or tilbydere av digitale
      tjenester - was not established from the text, so both are listed and this record is unconfirmed.
      digitalsikkerhetsloven splits the two at paragraph 6 and paragraph 9, and a reader must check which
      chapter of the forskrift this sits in.'
  digitalsikkerhetsloven:digitalsikkerhetsforskriften § 15:
    id: digitalsikkerhetsloven:digitalsikkerhetsforskriften § 15
    instrument: digitalsikkerhetsloven
    citation: digitalsikkerhetsforskriften § 15
    title: Tiltak for sikkerhetsstyring for tilbydere av digitale tjenester og kriterier for å avgjøre
      om en hendelse skal anses for å ha betydelig innvirkning (security management measures for digital
      service providers and criteria for significant impact)
    applies_from: '2025-10-01'
    role: entity
    system_class:
    - digital-tjeneste
    summary: For providers of digital services, the detailed security management measures and the test
      for when an incident counts as having significant impact are set by making EU Regulation 2018/151
      apply as Norwegian regulation, with the adaptations that follow from the EEA Agreement. So a digital
      service provider's operative detail sits in that incorporated EU regulation rather than in the Norwegian
      text.
    evidence_expected: Controls and incident-significance assessments mapped to the elements of Regulation
      (EU) 2018/151 as incorporated, rather than to the Norwegian regulation's Chapter 2 measures.
    verifiable: review
    status: active
    source_url: https://lovdata.no/dokument/SF/forskrift/2025-06-20-1131
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'A likely source of error for anyone cataloguing this act: the detailed technological measures
      in forskrift § 10 do not apply to digital service providers, who are routed to Regulation (EU) 2018/151
      instead. Regulation 2018/151 is a NIS1 implementing regulation, which is consistent with this act
      implementing NIS1. I did not separately open 2018/151, so its contents are not confirmed here. Filed
      under digitalsikkerhetsloven rather than a NIS2 key: this statute transposes Directive (EU) 2016/1148
      (NIS1) through the EEA agreement, and Norway has not transposed NIS2. Labelling it NIS2 would misstate
      which regime a client is in.'
  digitalsikkerhetsloven:digitalsikkerhetsforskriften § 17:
    id: digitalsikkerhetsloven:digitalsikkerhetsforskriften § 17
    instrument: digitalsikkerhetsloven
    citation: digitalsikkerhetsforskriften § 17
    title: Varslingsplikt (notification duty)
    applies_from: '2025-10-01'
    role: entity
    system_class:
    - samfunnsviktig-tjeneste
    - digital-tjeneste
    summary: A notification under the act's §§ 8 or 11 goes to the supervisory authority with a copy to
      the national contact point, and must be sent within 24 hours of the provider learning of the incident.
      The information must be updated within 72 hours, and a fuller incident report, covering the same
      points plus the remedial measures taken, is due within a month of the first notification.
    evidence_expected: The notification at each of the three stages with its required content, namely
      provider identity, affected service, the incident with likely causes and consequences, number of
      users affected and cross-border effects, plus the remedial measures in the one-month report.
    verifiable: review
    status: active
    source_url: https://lovdata.no/dokument/SF/forskrift/2025-06-20-1131/KAPITTEL_4#%C2%A717
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'Scope settled on review: § 17 binds BOTH regimes. It sits in Kapittel 4 of digitalsikkerhetsforskriften
      (FOR-2025-06-20-1131), the chapter of provisions common to both provider types, not in the essential-services
      chapter (Kap. 2, §§ 6-14) or the digital-services chapter (Kap. 3, § 15). Its first paragraph is
      drafted as the procedural shell for notices given under digitalsikkerhetsloven §§ 8 and 11 together,
      and those two are the notification duties o This is where the Norwegian clock actually lives, not
      in the statute. A textual wrinkle a client''s lawyers may well raise: the 24-hour sentence is written
      by reference to a provider of an essential service, even though the provision governs notifications
      under both § 8 and § 11, so whether the 24-hour limit formally binds digital service providers under
      § 11 is not settled on the face of the text. Reported here as the text reads rather than smoothed
      over. The supervisory authority may additionally demand status updates. Filed under digitalsikkerhetsloven
      rather than a NIS2 key: this statute transposes Directive (EU) 2016/1148 (NIS1) through the EEA
      agreement, and Norway has not transposed NIS2. Labelling it NIS2 would misstate which regime a client
      is in. Which of the two regimes this binds - tilbydere av samfunnsviktige tjenester or tilbydere
      av digitale tjenester - was not established from the text, so both are listed and this record is
      unconfirmed. digitalsikkerhetsloven splits the two at paragraph 6 and paragraph 9, and a reader
      must check which chapter of the forskrift this sits in.'
  digitalsikkerhetsloven:digitalsikkerhetsloven § 10:
    id: digitalsikkerhetsloven:digitalsikkerhetsloven § 10
    instrument: digitalsikkerhetsloven
    citation: digitalsikkerhetsloven § 10
    title: Krav om sikkerhet for tilbydere av digitale tjenester (security requirements for providers
      of digital services)
    applies_from: '2025-10-01'
    role: entity
    system_class:
    - digital-tjeneste
    summary: A provider of a digital service must assess the risk to the systems used to deliver it and
      implement proportionate technical and organisational measures matched to that risk, having regard
      to the state of technology. The assessment must take in the security of systems, equipment and premises,
      incident handling, service continuity management, monitoring, auditing and testing, and recognised
      international standards.
    evidence_expected: The risk assessment, the control set mapped to each of the five listed factors,
      and the monitoring, audit and test records that the fourth factor calls for.
    verifiable: hybrid
    status: active
    source_url: https://lovdata.no/dokument/NL/lov/2023-12-20-108
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'The most likely hook for a deployed LLM application in this act. Digital services under §
      9 are online marketplaces, online search engines and cloud services, where a cloud service is defined
      as giving access to a scalable and elastic pool of shareable computing resources, so an LLM service
      offered this way can fall in scope. Whether any particular application qualifies is a scoping judgement,
      not something the text settles. Note the duty names monitoring, auditing and testing as a factor
      to weigh, which is a weaker thing than a standing duty to test. Filed under digitalsikkerhetsloven
      rather than a NIS2 key: this statute transposes Directive (EU) 2016/1148 (NIS1) through the EEA
      agreement, and Norway has not transposed NIS2. Labelling it NIS2 would misstate which regime a client
      is in.'
  digitalsikkerhetsloven:digitalsikkerhetsloven § 11:
    id: digitalsikkerhetsloven:digitalsikkerhetsloven § 11
    instrument: digitalsikkerhetsloven
    citation: digitalsikkerhetsloven § 11
    title: Krav om varsling for tilbydere av digitale tjenester (notification requirement for providers
      of digital services)
    applies_from: '2025-10-01'
    role: entity
    system_class:
    - digital-tjeneste
    summary: A provider of a digital service must notify the designated body, without undue delay and
      regardless of confidentiality duties, of incidents significantly affecting service delivery. Here
      significance weighs the number of users affected, duration, geographic spread, how far the service
      lost functionality and the effect on economic and social activity.
    evidence_expected: Notifications with timestamps against internal awareness records, and the significance
      assessments showing how the five factors were applied.
    verifiable: review
    status: active
    source_url: https://lovdata.no/dokument/NL/lov/2023-12-20-108
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'The significance test is broader than the one in § 8, adding loss of functionality and economic
      impact. A small-provider exemption in digitalsikkerhetsforskriften § 3 lifts this duty, and the
      § 15 security duty, from digital service providers with fewer than 50 employees and annual turnover
      or balance sheet total at or below EUR 10 million. Filed under digitalsikkerhetsloven rather than
      a NIS2 key: this statute transposes Directive (EU) 2016/1148 (NIS1) through the EEA agreement, and
      Norway has not transposed NIS2. Labelling it NIS2 would misstate which regime a client is in.'
  digitalsikkerhetsloven:digitalsikkerhetsloven § 7:
    id: digitalsikkerhetsloven:digitalsikkerhetsloven § 7
    instrument: digitalsikkerhetsloven
    citation: digitalsikkerhetsloven § 7
    title: Krav om sikkerhet for tilbydere av samfunnsviktige tjenester (security requirements for providers
      of essential services)
    applies_from: '2025-10-01'
    role: entity
    system_class:
    - samfunnsviktig-tjeneste
    summary: A provider of an essential service must carry out a risk assessment of the network and information
      systems used to deliver the service, and put in place technical and organisational measures proportionate
      to that risk, judged against the state of technology. It must also take proportionate steps to prevent,
      detect and limit the effects of incidents so the service keeps running.
    evidence_expected: The current risk assessment for the systems behind the service, the measures traced
      back to assessed risks, and the preventive, detective and mitigating controls with evidence they
      operate.
    verifiable: hybrid
    status: active
    source_url: https://lovdata.no/dokument/NL/lov/2023-12-20-108
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'Scope caveat that matters for this record: the act covers essential services only in energy,
      transport, health, water supply, banking, financial market infrastructure and digital infrastructure.
      A system_class of important-entity is NIS2 vocabulary that this act does not use; its own categories
      are provider of an essential service and provider of a digital service, so the second class given
      here is the act''s actual one. Under § 5 these duties yield where another statute sets equivalent
      or stricter requirements. Filed under digitalsikkerhetsloven rather than a NIS2 key: this statute
      transposes Directive (EU) 2016/1148 (NIS1) through the EEA agreement, and Norway has not transposed
      NIS2. Labelling it NIS2 would misstate which regime a client is in.'
  digitalsikkerhetsloven:digitalsikkerhetsloven § 8:
    id: digitalsikkerhetsloven:digitalsikkerhetsloven § 8
    instrument: digitalsikkerhetsloven
    citation: digitalsikkerhetsloven § 8
    title: Krav om varsling for tilbydere av samfunnsviktige tjenester (notification requirement for providers
      of essential services)
    applies_from: '2025-10-01'
    role: entity
    system_class:
    - samfunnsviktig-tjeneste
    summary: A provider of an essential service must notify the body designated by the King, without undue
      delay and regardless of confidentiality duties, of incidents that significantly affect service delivery.
      Significance turns on how many users are affected, how long the incident lasts and how large the
      affected geographic area is.
    evidence_expected: Notifications sent with their timestamps against internal awareness records, and
      the significance assessment for incidents both reported and not reported.
    verifiable: review
    status: active
    source_url: https://lovdata.no/dokument/NL/lov/2023-12-20-108
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'The statute itself sets no clock beyond without undue delay. The 24-hour and 72-hour figures
      come from digitalsikkerhetsforskriften § 17, recorded separately; citing a 24-hour deadline to this
      section alone would be wrong. Filed under digitalsikkerhetsloven rather than a NIS2 key: this statute
      transposes Directive (EU) 2016/1148 (NIS1) through the EEA agreement, and Norway has not transposed
      NIS2. Labelling it NIS2 would misstate which regime a client is in.'
  dora:Art.24(6):
    id: dora:Art.24(6)
    instrument: dora
    citation: Art.24(6)
    title: General requirements for the performance of digital operational resilience testing
    applies_from: '2025-01-17'
    role: entity
    system_class:
    - important-entity
    summary: Entities other than microenterprises must ensure that appropriate tests are conducted at
      least yearly on all ICT systems and applications supporting critical or important functions.
    evidence_expected: A coverage matrix mapping every ICT system and application supporting a critical
      or important function to a test within the last twelve months, with the test type and date; the
      justification for what counts as an appropriate test for each; explicit treatment of the AI application
      and its supporting components.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: This yearly coverage duty, not the three-year TLPT cycle, is the one that most often pulls
      a newly deployed LLM application into scope for testing. Neither the annual cadence nor completeness
      of coverage can be established by probing the system.
  dora:Art.26(3):
    id: dora:Art.26(3)
    instrument: dora
    citation: Art.26(3)
    title: Advanced testing of ICT tools, systems and processes based on TLPT
    applies_from: '2025-01-17'
    role: entity
    system_class:
    - ict-third-party
    summary: Where ICT third-party service providers fall within the scope of a threat-led penetration
      test, the entity must take the measures and safeguards needed to secure their participation. The
      entity retains full responsibility for compliance with DORA at all times.
    evidence_expected: The contractual basis for the provider's participation, which Art.30(3)(d) requires
      for critical or important function contracts; correspondence or test records showing the provider
      actually took part; the safeguards agreed with the provider; the entity's own record of retained
      responsibility.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'This is the provision that bites when the AI capability is a third-party model or inference
      service: the entity must either bring the provider into the test or use the pooled route in Art.26(4),
      and cannot treat the provider''s refusal as an excuse.'
  dora:Art.26(4):
    id: dora:Art.26(4)
    instrument: dora
    citation: Art.26(4)
    title: Advanced testing of ICT tools, systems and processes based on TLPT
    applies_from: '2025-01-17'
    role: entity
    system_class:
    - ict-third-party
    summary: Where a provider's participation would be reasonably expected to harm the quality or security
      of its services to customers outside DORA's scope, or the confidentiality of data relating to those
      services, the entity and the provider may agree in writing that the provider contracts an external
      tester directly for a pooled test covering several financial entities under one designated entity's
      direction. The pooled test counts as the TLPT of each participating entity.
    evidence_expected: The written agreement with the provider; the designation of the directing entity;
      the pooled test's scope showing it covers the relevant range of ICT services supporting critical
      or important functions contracted to that provider; the calibration rationale for how many entities
      took part.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: Practically the route for a shared AI or cloud inference platform serving many financial entities
      alongside non-financial customers. Commission Delegated Regulation (EU) 2025/1190 Arts.6 and 8 add
      risk management and procedural specifics for pooled and joint tests.
  dora:Art.26(6):
    id: dora:Art.26(6)
    instrument: dora
    citation: Art.26(6)
    title: Advanced testing of ICT tools, systems and processes based on TLPT
    applies_from: '2025-01-17'
    role: entity
    system_class:
    - important-entity
    summary: Once reports and remediation plans have been agreed at the end of testing, the entity and,
      where relevant, the external testers must give the designated authority a summary of the relevant
      findings, the remediation plans, and documentation showing the test was conducted as required.
    evidence_expected: The summary findings report, the remediation plans, and the supporting documentation
      pack as submitted, with submission dates; the authority's acknowledgement; under Art.26(7), the
      attestation received and the notification of it to the competent authority.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: The content and timing are set by Commission Delegated Regulation (EU) 2025/1190 Art.12(7)
      and Annex VII for the summary report and Art.13 for the remediation plan, and the attestation content
      by its Art.14 and Annex VIII. A deliverable intended to support this submission has to be built
      to the Annex VII structure, not to a generic pen-test report format.
  dora:Art.27(2):
    id: dora:Art.27(2)
    instrument: dora
    citation: Art.27(2)
    title: Requirements for testers for the carrying out of TLPT
    applies_from: '2025-01-17'
    role: entity
    system_class:
    - important-entity
    summary: 'When internal testers are used, three further conditions apply on top of Article 27(1):
      the competent authority or the designated single public authority must have approved that use, the
      authority must have verified that the entity has sufficient dedicated resources and has avoided
      conflicts of interest across test design and execution, and the threat intelligence provider must
      be external to the entity.'
    evidence_expected: The authority's written approval of internal tester use; the resourcing and conflict-of-interest
      evidence put before the authority; the contract with the external threat intelligence provider showing
      it sits outside the entity.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: Commission Delegated Regulation (EU) 2025/1190 Art.15 sets out the internal tester arrangements
      in detail, including a documented and periodically reviewed policy, an internal team of a test lead
      plus at least two further members, and a requirement that all team members have been employed by
      the entity or an intra-group provider for the preceding twelve months. Its Art.15(4) treats testers
      employed by an ICT intra-group service provider as internal testers.
  dora:Art.27(3):
    id: dora:Art.27(3)
    instrument: dora
    citation: Art.27(3)
    title: Requirements for testers for the carrying out of TLPT
    applies_from: '2025-01-17'
    role: entity
    system_class:
    - important-entity
    summary: The entity must ensure its contracts with external testers require sound management of the
      test results, and that any processing of those results, including generating, storing, aggregating,
      drafting, reporting, communicating or destroying them, does not create risks for the entity.
    evidence_expected: Contract clauses on handling, storage, retention and destruction of test results
      and findings; the tester's data handling and destruction records; evidence that credentials and
      other secrets exposed during testing were securely deleted and the compromise communicated.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: Acutely relevant where an AI red-team engagement produces reusable attack artefacts such as
      working jailbreak prompts or extracted training or retrieval data, since those are test results
      whose handling this paragraph governs. Commission Delegated Regulation (EU) 2025/1190 Art.7(1)(g)
      spells out the end-of-test restoration and secure deletion steps.
  dora:Art.28(1):
    id: dora:Art.28(1)
    instrument: dora
    citation: Art.28(1)
    title: General principles
    applies_from: '2025-01-17'
    role: entity
    system_class:
    - ict-third-party
    summary: ICT third-party risk must be managed as an integral component of ICT risk inside the Article
      6(1) framework. An entity using contracted ICT services to run its business remains fully responsible
      at all times for complying with and discharging its DORA and financial services law obligations,
      and must apply proportionality to the nature, scale and importance of its ICT dependencies.
    evidence_expected: The part of the framework addressing third-party ICT risk; the proportionality
      analysis for each dependency; evidence that a third-party supplied AI capability is managed as the
      entity's own ICT risk rather than as a vendor matter, with named internal ownership.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: The non-delegation principle in point (a) is the answer to a client arguing that a model provider's
      own certifications discharge its DORA obligations. They do not.
  dora:Art.28(2):
    id: dora:Art.28(2)
    instrument: dora
    citation: Art.28(2)
    title: General principles
    applies_from: '2025-01-17'
    role: entity
    system_class:
    - ict-third-party
    summary: Entities other than those on the simplified framework and microenterprises must adopt and
      regularly review a strategy on ICT third-party risk, including a policy on the use of ICT services
      supporting critical or important functions, applied at individual and where relevant sub-consolidated
      and consolidated level. The management body must regularly review the risks identified in those
      critical-function arrangements.
    evidence_expected: The ICT third-party risk strategy and the policy on ICT services supporting critical
      or important functions; the multi-vendor strategy where applicable; management body minutes recording
      the periodic risk review; the policy's treatment of AI and model-provider dependencies.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: The detailed content of this policy is specified by Commission Delegated Regulation (EU) 2024/1773
      of 13 March 2024, adopted under Art.28(10), which is the instrument to review the policy against
      rather than Art.28(2) alone.
  dora:Art.28(3):
    id: dora:Art.28(3)
    instrument: dora
    citation: Art.28(3)
    title: General principles
    applies_from: '2025-01-17'
    role: entity
    system_class:
    - ict-third-party
    summary: The entity must maintain and keep updated, at entity and where relevant sub-consolidated
      and consolidated level, a register of information covering all contractual arrangements for ICT
      services from third-party providers, documented so that arrangements supporting critical or important
      functions are distinguishable from the rest. It must report at least yearly to the competent authority
      on new arrangements, provider categories, contract types and services, make the register available
      on request, and notify planned critical-function arrangements in good time.
    evidence_expected: The register of information in the prescribed template form, with the critical-or-important-function
      flag set correctly for each arrangement; the annual report submitted to the competent authority;
      notifications of planned critical-function arrangements; register entries for model, inference and
      AI tooling providers, including any reached through a reseller or cloud marketplace.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: The templates are set by Commission Implementing Regulation (EU) 2024/2956 of 29 November 2024,
      adopted under Art.28(9). In practice AI service dependencies are frequently missing from or miscategorised
      in the register, which makes this a high-yield check in an AI assurance engagement.
  dora:Art.28(4):
    id: dora:Art.28(4)
    instrument: dora
    citation: Art.28(4)
    title: General principles
    applies_from: '2025-01-17'
    role: entity
    system_class:
    - ict-third-party
    summary: Before entering a contract for ICT services the entity must assess whether it supports a
      critical or important function, check that supervisory conditions for contracting are met, identify
      and assess all relevant risks including any contribution to ICT concentration risk, complete due
      diligence confirming the prospective provider is suitable, and identify and assess conflicts of
      interest.
    evidence_expected: The pre-contractual assessment and due diligence file for each provider, dated
      before contract signature; the criticality determination with its reasoning; the concentration risk
      analysis; the conflicts assessment; for an AI provider, due diligence covering its own security
      posture, subcontracting and data handling.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'The sequencing matters for audit: an assessment produced after the contract was signed does
      not satisfy a duty expressed as a precondition to entering the arrangement, which is a common finding
      where AI tools were procured quickly.'
  dora:Art.28(6):
    id: dora:Art.28(6)
    instrument: dora
    citation: Art.28(6)
    title: General principles
    applies_from: '2025-01-17'
    role: entity
    system_class:
    - ict-third-party
    summary: In exercising access, inspection and audit rights over a provider the entity must predetermine,
      on a risk basis, how often audits and inspections occur and which areas they cover, following commonly
      accepted audit standards. Where the arrangement involves high technical complexity, the entity must
      verify that the auditors, internal or external, have the skills and knowledge to perform the audits
      effectively.
    evidence_expected: The risk-based audit plan for each provider with frequency and scope set in advance;
      the audit standard applied; the documented competence assessment of the auditors where the arrangement
      is technically complex; completed provider audit reports.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: The auditor-competence requirement for high technical complexity is the natural hook for insisting
      on AI-specific expertise when auditing a model or inference provider, though the text speaks of
      technical complexity generally and says nothing about AI.
  dora:Art.28(8):
    id: dora:Art.28(8)
    instrument: dora
    citation: Art.28(8)
    title: General principles
    applies_from: '2025-01-17'
    role: entity
    system_class:
    - ict-third-party
    summary: For ICT services supporting critical or important functions the entity must have exit strategies
      that account for provider failure, service quality deterioration and business disruption, and must
      be able to exit without disrupting its business, limiting regulatory compliance or harming service
      to clients. Exit plans must be comprehensive, documented, sufficiently tested and periodically reviewed,
      with alternative solutions, transition plans for removing services and data, and contingency measures
      identified.
    evidence_expected: The documented exit and transition plan for each critical provider; the named alternative
      solution and the analysis of its viability; records of the exit plan being tested and periodically
      reviewed; the data extraction and migration approach.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: Hard to satisfy for AI dependencies, because substituting a model rarely preserves behaviour,
      so a credible exit plan has to address requalification and output differences, not just data portability.
      Classified review rather than hybrid because the testing contemplated here is exit and transition
      rehearsal, not an adversarial run against the deployed system.
  dora:Art.6(4):
    id: dora:Art.6(4)
    instrument: dora
    citation: Art.6(4)
    title: ICT risk management framework
    applies_from: '2025-01-17'
    role: entity
    system_class:
    - important-entity
    summary: Entities other than microenterprises must give responsibility for managing and overseeing
      ICT risk to a control function with an appropriate level of independence, and must keep ICT risk
      management, control and internal audit functions properly segregated along three-lines-of-defence
      or equivalent lines.
    evidence_expected: Organisational charts and reporting lines showing the ICT risk control function
      and its independence; terms of reference for that function; an analysis of conflicts of interest,
      particularly where the team building or operating an AI system also assures it.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: This matters in AI engagements because model development, deployment and evaluation are often
      concentrated in one team, which is exactly the segregation problem this paragraph addresses.
  dora:Art.9(4):
    id: dora:Art.9(4)
    instrument: dora
    citation: Art.9(4)
    title: Protection and prevention
    applies_from: '2025-01-17'
    role: entity
    system_class:
    - important-entity
    summary: As part of the framework the entity must develop an information security policy and, on a
      risk basis, put in place network and infrastructure management allowing affected assets to be isolated,
      least-privilege physical and logical access controls, strong authentication and cryptographic key
      protection with encryption driven by data classification, documented ICT change management covering
      software and security parameters, and comprehensive patch and update policies.
    evidence_expected: The information security policy; access control and privileged access records;
      authentication and key management configuration and standards; the change management procedure with
      approval and test records for changes to the AI system, its prompts and its security parameters;
      patch policy and current patch state.
    verifiable: hybrid
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: Point (e) requires change management to cover security parameters, which in an LLM deployment
      reasonably extends to system prompts, guardrail configuration and model version pinning; that reading
      is an inference, not something the text says about AI. A probe can demonstrate weak authentication,
      excessive privilege or an unlogged configuration change, so it can establish failure, but the existence
      of the policies and the change process is a documentary question.
  dora:RTS (EU) 2025/1190 Art.11(5):
    id: dora:RTS (EU) 2025/1190 Art.11(5)
    instrument: dora
    citation: RTS (EU) 2025/1190 Art.11(5)
    title: 'Testing phase: red team test'
    applies_from: '2025-07-08'
    role: entity
    system_class:
    - important-entity
    summary: The active red team testing phase must be proportionate to the scope and to the scale, activity,
      complexity and number of entities and providers involved, and in any case must last at least twelve
      weeks. Scenarios may run in sequence or concurrently, and the control team, threat intelligence
      provider, testers and test managers agree when the phase ends.
    evidence_expected: The approved red team test plan in Annex IV form; start and end dates for the active
      phase evidencing at least twelve weeks; the weekly progress reports to the control team and test
      managers required by Art.11(7); the record of the parties' agreement on the phase ending.
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg_del/2025/1190/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'The twelve-week floor is in the delegated regulation, not in DORA, and it is the single most
      commercially significant TLPT constraint: a short AI red-team sprint cannot be sold as a TLPT however
      thorough it is. Under Art.11(10) the duration of any limited purple teaming substituted in exceptional
      circumstances counts toward the twelve weeks.'
  dora:RTS (EU) 2025/1190 Art.9(6):
    id: dora:RTS (EU) 2025/1190 Art.9(6)
    instrument: dora
    citation: RTS (EU) 2025/1190 Art.9(6)
    title: Preparation phase
    applies_from: '2025-07-08'
    role: entity
    system_class:
    - important-entity
    summary: Within six months of the TLPT authority's notification the entity must submit a scope specification
      document containing all the information required by Annex II, and its management body must approve
      that document. Article 9(7) lists the criteria for deciding which critical or important functions
      to include, among them criticality and sectoral impact, importance to day-to-day operations, exchangeability,
      interconnectedness, geographical location, other entities' dependence, and available threat intelligence
      on the function.
    evidence_expected: The scope specification document in Annex II form with its management body approval
      and date, inside the six-month window from notification; the reasoning against each Art.9(7) criterion
      for functions included and excluded; the TLPT authority's approval of the document; the project
      charter and initiation information submitted within three months under Art.9(2).
    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/eli/reg_del/2025/1190/oj/eng
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: The obligation and its deadlines come from the delegated regulation; DORA Art.26(2) requires
      only that the scope assessment be validated by competent authorities. Nothing in the criteria mentions
      AI, so an AI-supported function enters scope through ordinary criticality analysis, not a dedicated
      route.
  iso-42001:A.5.2:
    id: iso-42001:A.5.2
    instrument: iso-42001
    citation: A.5.2
    title: Repeatable process for assessing AI system impacts
    applies_from: null
    role: both
    system_class:
    - all
    summary: Requires the organisation to have a defined, repeatable way of working out how an AI system
      could affect people and society, rather than deciding case by case. An auditor looks for the procedure
      itself and for evidence it was actually applied to this system at the points it claims to apply.
    evidence_expected: The written procedure, showing its trigger points (for example before release and
      after a material change), who performs it and how results are treated; plus completed assessment
      records for the LLM application that demonstrate the procedure was followed at those trigger points
      rather than retrofitted.
    verifiable: review
    status: active
    source_url: https://www.iso.org/standard/42001
    last_checked: '2026-10-15'
    verification: unconfirmed
    notes: 'ISO/IEC 42001:2023 is a paywalled standard (CHF 225 from ISO), and there is no free official
      text of Annex A anywhere. The control''s own wording therefore cannot be read from an official source,
      so the record cannot honestly be marked source-confirmed. Specifically, every official route is
      gated: 1. ISO''s free "Read sample" reader at iso.org exposes the table of contents and the informative
      front matter only. It stat Corroborated from independent certification-body sources that the control
      exists and what area it covers; none of the standard''s wording appears here. This record can never
      be source-confirmed while the standard is paywalled, and that is a property of the standard rather
      than of our research.'
