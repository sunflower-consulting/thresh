    verifiable: review
    status: active
    source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: 'A clean review item: the obligation is a document with an enumerated content list, and no
      probe of a deployed system can establish that the document exists or is complete. A red team can
