    source_url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
    last_checked: '2026-10-15'
    verification: source-confirmed
    notes: For an LLM application this is where system prompts, retrieval configuration, tool access and
      guardrail settings are checked against what the provider's instructions permit. Paragraph 3 preserves
      other obligations under Union or national law and the deployer's freedom to organise its own resources.
      Unamended by the Omnibus. For Annex I product-embedded high-risk systems the date is 2028-08-02.
  ai-act:Art.26(2):
    id: ai-act:Art.26(2)
    instrument: ai-act
